spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peanut}
    username: ${DB_USER:peanut}
    password: ${DB_PASS:peanut123}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    mode: XML
    check-template-location: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  task:
    scheduling:
      pool:
        size: 4
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:peanut}
    password: ${RABBITMQ_PASS:peanut-rabbit-dev}

ai-service:
  base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}

influxdb:
  url: ${INFLUXDB_URL:http://127.0.0.1:8086}
  token: ${INFLUXDB_TOKEN:peanut-token-dev}
  org: ${INFLUXDB_ORG:peanut}
  bucket: ${INFLUXDB_BUCKET:sensors}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: peanut-backend-${random.uuid}
  qos: 1
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

patrol:
  offline:
    drone-seconds: ${PATROL_DRONE_OFFLINE_SECONDS:90}
    dock-seconds: ${PATROL_DOCK_OFFLINE_SECONDS:180}
    sensor-seconds: ${PATROL_SENSOR_OFFLINE_SECONDS:180}
    scan-ms: ${PATROL_OFFLINE_SCAN_MS:5000}
  zone: ${PATROL_ZONE:Asia/Shanghai}
  image-directory: ${PATROL_IMAGE_DIRECTORY:../.local/patrol-images}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  access-expire-ms: 7200000
  refresh-expire-ms: 604800000

growth-report:
  cron: ${GROWTH_REPORT_CRON:0 0 2 * * MON}
  zone: ${GROWTH_REPORT_ZONE:Asia/Shanghai}
  directory: ${GROWTH_REPORT_DIRECTORY:.local/growth-reports}
  font: ${GROWTH_REPORT_FONT:}
  public-base-url: ${GROWTH_REPORT_PUBLIC_BASE_URL:}
  webhook: ${GROWTH_REPORT_WEBHOOK_URL:}
  pushplus-token: ${GROWTH_REPORT_PUSHPLUS_TOKEN:}
  oss:
    endpoint: ${GROWTH_REPORT_OSS_ENDPOINT:}
    region: ${GROWTH_REPORT_OSS_REGION:}
    bucket: ${GROWTH_REPORT_OSS_BUCKET:}
    access-key-id: ${GROWTH_REPORT_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${GROWTH_REPORT_OSS_ACCESS_KEY_SECRET:}

knowledge:
  admin-token: ${KNOWLEDGE_ADMIN_TOKEN:}
